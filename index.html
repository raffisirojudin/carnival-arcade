<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E8232A">
<title>CARNIVAL ARCADE</title>
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Fredoka+One&family=Permanent+Marker&family=Righteous&display=swap" rel="stylesheet">
<style>
:root{
  --cr:#E8232A;--cy:#F5C400;--cb:#1A6FBF;--cg:#2DB84B;
  --co:#F07020;--cp:#E8478A;--cv:#7B3FB5;--ct:#00B4CC;
  --ink:#1A1008;--cream:#FFF5E1;--paper:#FDF6E8;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:none;}
body{background:var(--cream);font-family:'Boogaloo',cursive;color:var(--ink);}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:9000;
  background-image:radial-gradient(circle,rgba(26,16,8,.05) 1px,transparent 1px);
  background-size:5px 5px;}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:9001;
  border:12px solid transparent;
  border-image:repeating-linear-gradient(45deg,
    var(--cr) 0,var(--cr) 12px,var(--cy) 12px,var(--cy) 24px,
    var(--cb) 24px,var(--cb) 36px,var(--cg) 36px,var(--cg) 48px) 12;}
.fd{position:fixed;pointer-events:none;z-index:8999;font-size:24px;
  animation:fdA var(--t,3s) ease-in-out infinite;}
@keyframes fdA{0%,100%{transform:translateY(0) rotate(var(--r0,0deg))}
  50%{transform:translateY(-14px) rotate(var(--r1,8deg))}}

/* ── MENU ── */
#menuWrap{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;padding:14px 16px 10px;overflow-y:auto;gap:9px;
  -webkit-overflow-scrolling:touch;}
.m-banner{background:var(--cr);border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);
  padding:7px 32px 11px;transform:rotate(-1.2deg);text-align:center;position:relative;flex-shrink:0;}
.m-title{font-family:'Permanent Marker',cursive;font-size:clamp(28px,7vw,46px);color:var(--cy);
  text-shadow:3px 3px 0 var(--ink);line-height:1;letter-spacing:2px;}
.m-sub{font-family:'Fredoka One',cursive;font-size:clamp(9px,2.5vw,13px);color:var(--cream);letter-spacing:4px;margin-top:2px;}
.m-star{position:absolute;top:-14px;right:-16px;font-size:26px;animation:fdA 2s infinite;--r0:10deg;--r1:-10deg;}
.m-rep{background:var(--ink);padding:6px 16px;display:flex;align-items:center;
  gap:10px;flex-wrap:wrap;justify-content:center;flex-shrink:0;}
.m-rep-label{font-family:'Righteous',cursive;font-size:9px;color:var(--cy);letter-spacing:2px;}
.m-rep-val{font-family:'Fredoka One',cursive;font-size:18px;color:var(--cream);}
.m-rep-items{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.m-ri{text-align:center;font-size:9px;color:rgba(255,245,225,.5);}
.m-ri b{display:block;font-size:14px;color:var(--cy);font-family:'Fredoka One',cursive;}
.m-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;
  width:100%;max-width:860px;flex-shrink:0;}
@media(max-width:640px){.m-grid{grid-template-columns:repeat(3,1fr);gap:7px;}}
@media(max-width:400px){.m-grid{grid-template-columns:repeat(2,1fr);gap:6px;}}
.m-tile{background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  padding:10px 6px 8px;cursor:pointer;text-align:center;position:relative;overflow:hidden;
  transition:transform .1s,box-shadow .1s;user-select:none;-webkit-user-select:none;}
.m-tile:hover{transform:translate(-2px,-3px);box-shadow:7px 7px 0 var(--ink);}
.m-tile:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink);}
.m-tile-sw{position:absolute;inset:0;opacity:.13;}
.m-tile-icon{font-size:clamp(22px,5vw,30px);display:block;margin-bottom:4px;line-height:1;}
.m-tile-name{font-family:'Fredoka One',cursive;font-size:clamp(10px,2.5vw,12px);display:block;line-height:1.1;}
.m-tile-best{font-size:9px;color:rgba(26,16,8,.4);display:block;margin-top:2px;}
.m-tile-badge{position:absolute;top:-3px;right:-3px;background:var(--cr);color:var(--cy);
  font-family:'Fredoka One',cursive;font-size:7px;padding:2px 4px;border:2px solid var(--ink);}

/* ── SOUND TOGGLE ── */
#soundBtn{
  background:rgba(255,245,225,.12);border:2px solid rgba(255,245,225,.3);
  color:var(--cream);font-size:16px;padding:4px 8px;cursor:pointer;
  font-family:'Fredoka One',cursive;flex-shrink:0;
  min-width:36px;min-height:30px;
}
#soundBtn:active{background:rgba(255,245,225,.25);}

/* ── GAME ── */
#gameWrap{position:absolute;inset:0;display:none;flex-direction:column;background:var(--paper);}
#gameWrap.on{display:flex;}
#g-hud{display:flex;align-items:center;justify-content:space-between;
  padding:5px 12px;background:var(--ink);flex-shrink:0;min-height:38px;}
.g-name{font-family:'Fredoka One',cursive;font-size:clamp(12px,3.5vw,16px);color:var(--cy);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:35%;}
.g-scores{display:flex;gap:12px;}
.g-sv{font-family:'Righteous',cursive;font-size:clamp(15px,4vw,19px);color:var(--cream);}
.g-sv span{font-size:8px;display:block;color:rgba(255,245,225,.4);letter-spacing:1px;line-height:1;}
#g-quit{font-family:'Fredoka One',cursive;font-size:11px;background:var(--cr);
  color:var(--cream);border:2px solid var(--cream);padding:3px 9px;cursor:pointer;
  flex-shrink:0;min-width:54px;min-height:30px;}
#g-canvas{flex:1;display:block;width:100%;touch-action:none;}

/* ── VIRTUAL CONTROLS ── */
#vCtrl{
  position:absolute;bottom:0;left:0;right:0;
  display:none;
  height:110px;
  background:rgba(26,16,8,.7);
  flex-shrink:0;z-index:200;
  align-items:center;
  justify-content:space-between;
  padding:8px 16px;
  pointer-events:auto;
}
#vCtrl.show{display:flex;}

/* D-pad left */
.dpad{display:grid;grid-template-columns:44px 44px 44px;grid-template-rows:44px 44px 44px;gap:2px;}
.dp-btn{
  background:rgba(255,245,225,.12);border:2px solid rgba(255,245,225,.25);
  color:var(--cream);font-size:18px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;
  border-radius:4px;active-color:rgba(255,245,225,.3);
}
.dp-btn:active,.dp-btn.pressed{background:rgba(255,245,225,.3);}
.dp-center{background:transparent;border-color:transparent;cursor:default;}

/* action buttons right */
.abtn-wrap{display:flex;flex-direction:column;gap:6px;align-items:center;}
.a-btn{
  width:64px;height:64px;border-radius:50%;
  background:rgba(232,35,42,.7);border:3px solid rgba(255,255,255,.4);
  color:var(--cream);font-family:'Fredoka One',cursive;font-size:12px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;
  box-shadow:0 4px 0 rgba(0,0,0,.4);
}
.a-btn:active,.a-btn.pressed{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.4);}
.a-btn.blue{background:rgba(26,111,191,.7);}
.a-btn.small{width:48px;height:48px;font-size:10px;}

/* hint bar */
#g-ctrl{background:var(--ink);color:rgba(255,245,225,.35);font-size:10px;
  padding:3px 12px;display:flex;justify-content:space-between;flex-shrink:0;}

/* ── DEATH ── */
#death{position:absolute;inset:0;display:none;flex-direction:column;
  align-items:center;justify-content:center;background:rgba(26,16,8,.87);z-index:500;gap:5px;}
#death.on{display:flex;}
.d-banner{background:var(--cr);border:4px solid var(--cream);box-shadow:5px 5px 0 rgba(0,0,0,.5);
  padding:6px 28px 10px;transform:rotate(-2deg);}
.d-title{font-family:'Permanent Marker',cursive;font-size:clamp(24px,6vw,34px);color:var(--cy);text-shadow:2px 2px 0 var(--ink);}
.d-big{font-family:'Fredoka One',cursive;font-size:clamp(48px,12vw,65px);color:var(--cream);
  text-shadow:4px 4px 0 var(--ink);line-height:1;}
.d-rec{font-family:'Boogaloo',cursive;font-size:14px;color:var(--cy);letter-spacing:2px;}
.d-btns{display:flex;gap:10px;margin-top:10px;}
.btn{font-family:'Fredoka One',cursive;font-size:14px;border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);padding:8px 20px;cursor:pointer;
  transition:transform .1s,box-shadow .1s;min-height:44px;}
.btn:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--ink);}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink);}
.btn-g{background:var(--cg);color:var(--ink);}
.btn-b{background:var(--cb);color:var(--cream);}

/* ── SWIPE HINT (mobile only) ── */
#swipeHint{
  position:absolute;bottom:120px;left:50%;transform:translateX(-50%);
  background:rgba(26,16,8,.75);color:var(--cream);font-family:'Fredoka One',cursive;
  font-size:12px;padding:6px 16px;letter-spacing:1px;
  display:none;z-index:300;pointer-events:none;text-align:center;
  border:2px solid rgba(255,245,225,.2);
}
</style>

<body>

<div class="fd" style="top:7%;left:2%;--t:3.1s;--r0:8deg;--r1:-8deg">🎈</div>
<div class="fd" style="top:12%;right:4%;--t:2.7s;--r0:-5deg;--r1:12deg">⭐</div>

<div class="fd" style="bottom:7%;right:3%;--t:2.9s;--r0:-8deg;--r1:6deg">🎠</div>
<div class="fd" style="top:38%;left:1%;--t:4.1s;--r0:0deg;--r1:15deg">🍭</div>
<div class="fd" style="top:52%;right:1.5%;--t:3.4s;--r0:5deg;--r1:-5deg">🎡</div>

<script>
'use strict';
// ═══════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const TAU=Math.PI*2;
const dst=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function aabb(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
const C={cr:'#E8232A',cy:'#F5C400',cb:'#1A6FBF',cg:'#2DB84B',co:'#F07020',
         cp:'#E8478A',cv:'#7B3FB5',ct:'#00B4CC',ink:'#1A1008',cream:'#FFF5E1',paper:'#FDF6E8'};
const PAL=[C.cr,C.cy,C.cb,C.cg,C.co,C.cp,C.cv,C.ct];

// ═══════════════════════════════════════
//  AUDIO ENGINE (Web Audio API)
// ═══════════════════════════════════════
const SFX = (() => {
  let ctx = null;
  let enabled = true;

  function getCtx() {
    if (!ctx) {
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
    if (ctx && ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // Synth a sound: type, freq, duration, vol, optional freq sweep
  function synth({ type='square', freq=440, freq2=null, dur=0.12, vol=0.3, attack=0.005, decay=0.08 }) {
    if (!enabled) return;
    const ac = getCtx(); if (!ac) return;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ac.currentTime);
    if (freq2) osc.frequency.exponentialRampToValueAtTime(freq2, ac.currentTime + dur);
    gain.gain.setValueAtTime(0, ac.currentTime);
    gain.gain.linearRampToValueAtTime(vol, ac.currentTime + attack);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + attack + decay);
    osc.start(ac.currentTime);
    osc.stop(ac.currentTime + dur + 0.02);
  }

  // Noise burst (for explosions/hits)
  function noise(dur=0.15, vol=0.25) {
    if (!enabled) return;
    const ac = getCtx(); if (!ac) return;
    const bufLen = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, bufLen, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1);
    const src = ac.createBufferSource();
    src.buffer = buf;
    const gain = ac.createGain();
    const filter = ac.createBiquadFilter();
    filter.type = 'bandpass'; filter.frequency.value = 1200;
    src.connect(filter); filter.connect(gain); gain.connect(ac.destination);
    gain.gain.setValueAtTime(vol, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    src.start(); src.stop(ac.currentTime + dur + 0.01);
  }

  // All named sounds
  const sounds = {
    pop:    ()=>synth({type:'sine',freq:600,freq2:200,dur:.15,vol:.4,decay:.12}),
    coin:   ()=>synth({type:'sine',freq:880,freq2:1320,dur:.12,vol:.35,attack:.002,decay:.1}),
    score:  ()=>synth({type:'square',freq:440,freq2:660,dur:.1,vol:.25,decay:.08}),
    jump:   ()=>synth({type:'square',freq:300,freq2:500,dur:.12,vol:.28,decay:.1}),
    die:    ()=>{ noise(.2,.3); synth({type:'sawtooth',freq:200,freq2:60,dur:.3,vol:.35,decay:.28}); },
    hit:    ()=>noise(.1,.25),
    good:   ()=>{ synth({type:'sine',freq:523,dur:.1,vol:.3,decay:.08}); setTimeout(()=>synth({type:'sine',freq:659,dur:.1,vol:.3,decay:.08}),100); setTimeout(()=>synth({type:'sine',freq:784,dur:.15,vol:.35,decay:.12}),200); },
    drop:   ()=>synth({type:'square',freq:220,freq2:180,dur:.1,vol:.3,decay:.08}),
    whoosh: ()=>synth({type:'sawtooth',freq:400,freq2:150,dur:.15,vol:.2,decay:.12}),
    tick:   ()=>synth({type:'square',freq:1200,dur:.04,vol:.15,decay:.03}),
    bell:   ()=>synth({type:'sine',freq:1047,dur:.4,vol:.3,attack:.002,decay:.38}),
    mole:   ()=>synth({type:'sine',freq:350,freq2:600,dur:.08,vol:.32,decay:.06}),
    wrong:  ()=>{ synth({type:'sawtooth',freq:220,dur:.15,vol:.3,decay:.12}); setTimeout(()=>synth({type:'sawtooth',freq:180,dur:.18,vol:.3,decay:.15}),80); },
    splash: ()=>{ for(let i=0;i<3;i++) setTimeout(()=>synth({type:'sine',freq:rnd(400,900),dur:.08,vol:.2,decay:.06}),i*40); },
    menu:   ()=>synth({type:'sine',freq:660,freq2:880,dur:.1,vol:.25,decay:.08}),
  };

  function play(name) { sounds[name]?.(); }
  function toggle() { enabled = !enabled; return enabled; }
  function isOn() { return enabled; }

  return { play, toggle, isOn };
})();

// Sound button
const soundBtn = document.getElementById('soundBtn');
soundBtn.onclick = () => {
  const on = SFX.toggle();
  soundBtn.textContent = on ? '🔊' : '🔇';
  if (on) SFX.play('menu');
};

// ═══════════════════════════════════════
//  DEVICE DETECTION
// ═══════════════════════════════════════
const IS_TOUCH = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const IS_MOBILE = IS_TOUCH && window.innerWidth < 900;

// ═══════════════════════════════════════
//  SCORES
// ═══════════════════════════════════════
const SC={
  get(k){return parseInt(localStorage.getItem('ca3_'+k)||'0');},
  set(k,v){const b=this.get(k);if(v>b){localStorage.setItem('ca3_'+k,v);return true;}return false;},
  total(){return DEFS.reduce((a,d)=>a+this.get(d.key),0);}
};

// ═══════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════
class FX{
  constructor(){this.pool=[];}
  burst(x,y,n,cols,{sMin=60,sMax=240,lMin=.4,lMax=1.2,sz=6,shape='rect',grav=260}={}){
    for(let i=0;i<n;i++){
      const a=rnd(0,TAU),s=rnd(sMin,sMax),ml=rnd(lMin,lMax);
      this.pool.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:ml,max:ml,
        col:cols[ri(0,cols.length-1)],sz:rnd(sz*.5,sz*1.6),shape,rot:rnd(0,TAU),rv:rnd(-5,5),grav});
    }
  }
  tick(dt){
    this.pool=this.pool.filter(p=>{
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.grav*dt;p.rot+=p.rv*dt;p.life-=dt;return p.life>0;
    });
  }
  draw(ctx){
    for(const p of this.pool){
      const a=clamp(p.life/p.max,0,1);
      ctx.save();ctx.globalAlpha=a;ctx.fillStyle=p.col;
      ctx.translate(p.x,p.y);ctx.rotate(p.rot);
      if(p.shape==='circle'){ctx.beginPath();ctx.arc(0,0,p.sz/2,0,TAU);ctx.fill();}
      else if(p.shape==='star'){
        ctx.beginPath();
        for(let i=0;i<5;i++){const a1=i*TAU/5-TAU/4,a2=(i+.5)*TAU/5-TAU/4;
          ctx.lineTo(Math.cos(a1)*p.sz,Math.sin(a1)*p.sz);ctx.lineTo(Math.cos(a2)*(p.sz/2),Math.sin(a2)*(p.sz/2));}
        ctx.closePath();ctx.fill();
      } else ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz);
      ctx.restore();
    }
  }
}

class Shake{
  constructor(){this.t=0;this.i=0;}
  hit(i=8,d=.3){this.i=Math.max(this.i,i);this.t=d;}
  tick(dt){if(this.t>0)this.t-=dt;else this.i=0;}
  apply(ctx){if(this.t>0)ctx.translate(rnd(-this.i,this.i),rnd(-this.i,this.i));}
}

function box(ctx,x,y,w,h,col,sw=2.5){
  ctx.fillStyle='rgba(26,16,8,.12)';ctx.fillRect(x+4,y+4,w,h);
  ctx.fillStyle=col;ctx.fillRect(x,y,w,h);
  ctx.fillStyle='rgba(255,255,255,.24)';ctx.fillRect(x,y,w,6);
  ctx.strokeStyle=C.ink;ctx.lineWidth=sw;ctx.strokeRect(x,y,w,h);
}
function circ(ctx,x,y,r,col){
  ctx.fillStyle='rgba(26,16,8,.12)';ctx.beginPath();ctx.arc(x+3,y+3,r,0,TAU);ctx.fill();
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
  ctx.strokeStyle=C.ink;ctx.lineWidth=2.5;ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.arc(x-r*.28,y-r*.28,r*.33,0,TAU);ctx.fill();
}
function txt(ctx,s,x,y,{font='16px "Fredoka One",cursive',col=C.ink,align='left'}={}){
  ctx.font=font;ctx.textAlign=align;ctx.textBaseline='middle';
  ctx.fillStyle='rgba(26,16,8,.35)';ctx.fillText(s,x+2,y+2);
  ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.textAlign='left';
}

// ═══════════════════════════════════════
//  GAME 01 — BALLOON POP 🎈
// ═══════════════════════════════════════
class BalloonPop{
  hint='TAP / CLICK balloons! Don\'t let them escape. (3 lives)';
  vCtrl='tap'; // which virtual controls to show
  constructor(W,H,fx,sk){this.W=W;this.H=H;this.fx=fx;this.sk=sk;this.reset();}
  reset(){this.score=0;this.alive=true;this.lives=3;this.time=0;
    this.balls=[];this.spT=0;this.spI=1.1;this.speed=70;}
  spawn(){
    this.balls.push({x:rnd(50,this.W-50),y:this.H+70,vy:-(this.speed+rnd(0,40)),
      r:rnd(22,38),col:PAL[ri(0,PAL.length-1)],wob:rnd(0,TAU),ws:rnd(.5,2),
      pop:false,pt:0,face:Math.random()>.45});
  }
  click(mx,my){
    for(const b of this.balls){
      if(b.pop)continue;
      if(dst({x:mx,y:my},{x:b.x,y:b.y})<b.r+10){
        b.pop=true;b.pt=.28;this.score++;
        this.fx.burst(b.x,b.y,20,PAL,{shape:'circle',sz:5,sMax:170,lMax:.9});
        this.sk.hit(5,.15); SFX.play('pop');
      }
    }
  }
  tick(dt){
    if(!this.alive)return;
    this.time+=dt;this.speed=70+this.time*5;this.spI=Math.max(.42,1.1-this.time*.012);
    this.spT+=dt;if(this.spT>=this.spI){this.spT=0;this.spawn();}
    for(const b of this.balls){
      if(b.pop){b.pt-=dt;continue;}
      b.wob+=b.ws*dt;b.y+=b.vy*dt;b.x+=Math.sin(b.wob)*.9;
    }
    const esc=this.balls.filter(b=>!b.pop&&b.y+b.r<-20).length;
    if(esc>0){ this.lives-=esc; SFX.play('wrong'); }
    if(this.lives<=0){this.lives=0;this.alive=false;this.sk.hit(14,.5);SFX.play('die');}
    this.balls=this.balls.filter(b=>b.pop?b.pt>0:b.y+b.r>-20);
  }
  draw(ctx){
    const W=this.W,H=this.H;
    const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5BC8F5');g.addColorStop(1,'#D4EFF9');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
    [[W*.15,70],[W*.45,52],[W*.72,78],[W*.9,44]].forEach(([cx,cy])=>{
      ctx.fillStyle='rgba(255,255,255,.75)';
      [[0,0,54,22],[26,7,36,15],[-20,6,32,14]].forEach(([dx,dy,rx,ry])=>{ctx.beginPath();ctx.ellipse(cx+dx,cy+dy,rx,ry,0,0,TAU);ctx.fill();});
    });
    for(const b of this.balls){
      if(b.pop&&b.pt<=0)continue;
      ctx.save();ctx.translate(b.x,b.y);
      if(b.pop){ctx.scale(1+((.28-b.pt)*4),1+((.28-b.pt)*4));ctx.globalAlpha=b.pt/.28;}
      ctx.strokeStyle='rgba(26,16,8,.35)';ctx.lineWidth=1.5;
      ctx.beginPath();ctx.moveTo(0,b.r);ctx.quadraticCurveTo(5,b.r+18,0,b.r+30);ctx.stroke();
      ctx.fillStyle=b.col;ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=2;
      ctx.beginPath();ctx.ellipse(0,0,b.r,b.r*1.22,0,0,TAU);ctx.fill();ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.36)';ctx.beginPath();ctx.ellipse(-b.r*.3,-b.r*.3,b.r*.28,b.r*.18,-.4,0,TAU);ctx.fill();
      if(b.face){ctx.fillStyle='rgba(26,16,8,.55)';ctx.beginPath();ctx.arc(-b.r*.24,-b.r*.06,b.r*.1,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(b.r*.24,-b.r*.06,b.r*.1,0,TAU);ctx.fill();}
      ctx.fillStyle=b.col;ctx.beginPath();ctx.ellipse(0,b.r+3,4,5,0,0,TAU);ctx.fill();
      ctx.restore();
    }
    for(let i=0;i<3;i++){
      const hx=14+i*30, hy=H-14;const alive=i<this.lives;
      ctx.save();ctx.globalAlpha=alive?1:.18;ctx.fillStyle=alive?'#E8232A':'#888';
      ctx.beginPath();ctx.moveTo(hx,hy+4);ctx.bezierCurveTo(hx,hy,hx-10,hy-8,hx-10,hy-2);ctx.bezierCurveTo(hx-10,hy+2,hx,hy+8,hx,hy+8);ctx.bezierCurveTo(hx,hy+8,hx+10,hy+2,hx+10,hy-2);ctx.bezierCurveTo(hx+10,hy-8,hx,hy,hx,hy+4);ctx.closePath();ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha=1;
  }
}

// ═══════════════════════════════════════
//  GAME 02 — RIBBON SNAKE 🎀
// ═══════════════════════════════════════
class RibbonSnake{
  hint='SWIPE / ARROWS / WASD — Steer. Eat the cake!';
  vCtrl='dpad';
  constructor(W,H,fx,sk){this.W=W;this.H=H;this.fx=fx;this.sk=sk;
    this.G=24;this.cols=Math.floor(W/24);this.rows=Math.floor(H/24);this.reset();}
  reset(){
    this.score=0;this.alive=true;const r=Math.floor(this.rows/2);
    this.body=[{x:6,y:r},{x:5,y:r},{x:4,y:r}];
    this.dir={x:1,y:0};this.nd={x:1,y:0};this.mt=0;this.mi=.17;this.food=this.place();
  }
  place(){let fx,fy;do{fx=ri(1,this.cols-2);fy=ri(1,this.rows-2);}while(this.body.some(b=>b.x===fx&&b.y===fy));return{x:fx,y:fy,p:0};}
  input(k){
    const m={right:{x:1,y:0},left:{x:-1,y:0},up:{x:0,y:-1},down:{x:0,y:1},
             d:{x:1,y:0},a:{x:-1,y:0},w:{x:0,y:-1},s:{x:0,y:1}};
    const nd=m[k];if(!nd)return;
    if(nd.x!==0&&nd.x===-this.dir.x)return;
    if(nd.y!==0&&nd.y===-this.dir.y)return;
    this.nd={...nd};SFX.play('tick');
  }
  tick(dt){
    if(!this.alive)return;
    this.food.p+=dt*3;this.mt+=dt;if(this.mt<this.mi)return;this.mt=0;
    this.dir={...this.nd};
    const h={x:this.body[0].x+this.dir.x,y:this.body[0].y+this.dir.y};
    if(h.x<0||h.x>=this.cols||h.y<0||h.y>=this.rows||this.body.some(b=>b.x===h.x&&b.y===h.y)){
      this.alive=false;this.sk.hit(12,.4);SFX.play('die');
      this.fx.burst(h.x*this.G+this.G/2,h.y*this.G+this.G/2,28,PAL,{sz:7});return;
    }
    this.body.unshift(h);
    if(h.x===this.food.x&&h.y===this.food.y){
      this.score++;this.mi=Math.max(.07,this.mi-.005);SFX.play('coin');
      this.fx.burst(h.x*this.G+this.G/2,h.y*this.G+this.G/2,14,[C.cy,C.cp,C.cg],{shape:'star',sz:8,sMax:130});
      this.food=this.place();
    } else this.body.pop();
  }
  draw(ctx){
    const G=this.G;
    for(let r=0;r<this.rows;r++)for(let c=0;c<this.cols;c++){ctx.fillStyle=(r+c)%2?'#F5EDD8':'#FFF5E1';ctx.fillRect(c*G,r*G,G,G);}
    const fp=.8+.2*Math.sin(this.food.p);
    ctx.save();ctx.translate(this.food.x*G+G/2,this.food.y*G+G/2);ctx.scale(fp,fp);
    ctx.font=`${G-2}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🍰',0,0);ctx.restore();
    const pal=[C.cr,C.cp,C.cy,C.cg,C.cb,C.cv,C.co,C.ct];
    for(let i=this.body.length-1;i>=0;i--){
      const {x,y}=this.body[i];const px=x*G,py=y*G;const col=pal[i%pal.length];
      box(ctx,px+1,py+1,G-2,G-2,col,1.5);
      ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(px+2,py+2,G-4,3);
      if(i===0){ctx.fillStyle='#FFF';ctx.fillRect(px+4,py+5,5,5);ctx.fillRect(px+G-9,py+5,5,5);ctx.fillStyle=C.ink;ctx.fillRect(px+6,py+7,3,3);ctx.fillRect(px+G-7,py+7,3,3);}
    }
  }
}

// ═══════════════════════════════════════
//  GAME 03 — STACK MASTER 🎪
// ═══════════════════════════════════════
class StackMaster{
  hint='TAP / SPACE — Drop the block!';
  vCtrl='tap';
  constructor(W,H,fx,sk){this.W=W;this.H=H;this.fx=fx;this.sk=sk;this.reset();}
  reset(){
    this.score=0;this.alive=true;this.speed=130;this.bh=26;this.ci=0;
    this.stack=[{x:this.W/2-80,y:this.H-58,w:160,h:this.bh,col:C.ink}];
    this.cur={x:10,y:this.H-58-this.bh-4,w:160,h:this.bh,dir:1,col:PAL[0]};
    this.camY=0;this.tCY=0;this.dropped=false;
  }
  input(k){if(k==='action'||k==='up')this.drop();}
  drop(){
    if(this.dropped)return;this.dropped=true;
    const cu=this.cur,top=this.stack[this.stack.length-1];
    const ol=Math.max(cu.x,top.x),or=Math.min(cu.x+cu.w,top.x+top.w);
    if(or<=ol){this.alive=false;this.sk.hit(14,.5);SFX.play('die');
      this.fx.burst(cu.x+cu.w/2,cu.y,32,PAL,{sz:7,shape:'rect'});return;}
    const nw=or-ol;
    if(nw<cu.w){this.fx.burst(cu.x<ol?cu.x+nw/2:or+cu.w/2,cu.y+cu.h/2,12,[C.cr,C.cy],{sz:5,sMax:120});SFX.play('hit');}
    else SFX.play('good');
    this.score++;
    this.stack.push({x:ol,y:cu.y,w:nw,h:this.bh,col:cu.col});
    this.fx.burst(ol+nw/2,cu.y,10,[C.cy,'#FFF5E1'],{shape:'star',sz:6,sMax:110,lMax:.7});
    this.tCY+=this.bh+4;this.ci=(this.ci+1)%PAL.length;
    const ny=this.stack[this.stack.length-1].y-this.bh-4;
    this.cur={x:rnd(0,this.W-nw*1.4),y:ny,w:clamp(nw,18,this.W),h:this.bh,dir:1,col:PAL[this.ci]};
    this.cur.x=clamp(this.cur.x,0,this.W-this.cur.w);
    this.speed=Math.min(320,130+this.score*9);
    setTimeout(()=>this.dropped=false,60);
  }
  tick(dt){
    if(!this.alive)return;this.camY=lerp(this.camY,this.tCY,.08);
    const c=this.cur;c.x+=c.dir*this.speed*dt;
    if(c.x+c.w>this.W){c.x=this.W-c.w;c.dir=-1;}if(c.x<0){c.x=0;c.dir=1;}
  }
  draw(ctx){
    const W=this.W,H=this.H;ctx.fillStyle='#FFF5E1';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(26,16,8,.04)';ctx.lineWidth=1;
    for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    ctx.save();ctx.translate(0,this.camY);
    for(const b of this.stack)box(ctx,b.x,b.y,b.w,b.h,b.col);
    const c=this.cur,fl=Math.sin(Date.now()*.008)>.2;
    box(ctx,c.x,c.y,c.w,c.h,c.col);
    if(fl){ctx.strokeStyle=C.ink;ctx.lineWidth=3.5;ctx.strokeRect(c.x-2,c.y-2,c.w+4,c.h+4);}
    ctx.restore();
    txt(ctx,`HEIGHT ${this.score}`,12,H-14,{font:'13px "Boogaloo",cursive',col:'rgba(26,16,8,.38)'});
  }
}

// ═══════════════════════════════════════
//  GAME 04 — ORBIT KEEPER 🌀
// ═══════════════════════════════════════
// ═══════════════════════════════════════
//  GAME 04 — SPIN DODGE 🎠
//  Player rotates around center, dodge
//  incoming projectiles from all sides
// ═══════════════════════════════════════
// ═══════════════════════════════════════
//  GAME 04 — FROG JUMP 🐸
//  Hop between moving lily pads.
//  Tap/Space to jump to the next pad.
// ═══════════════════════════════════════
class FrogJump{
  hint='SPACE / TAP — Jump to next lily pad! Time it right.';
  vCtrl='tap';
  constructor(W,H,fx,sk){this.W=W;this.H=H;this.fx=fx;this.sk=sk;this.reset();}
  reset(){
    this.score=0;this.alive=true;this.time=0;
    this.scrollX=0;this.speed=80;
    this.frog={x:120,y:0,onPad:true,padIdx:0,jumping:false,jumpT:0,
      jumpFrom:{x:0,y:0},jumpTo:{x:0,y:0},frame:0,frameT:0,squish:1};
    this.jumpQueued=false;
    this.pads=[];this._genPads(10);
    const first=this.pads[0];
    this.frog.y=first.y-22;this.frog.padIdx=0;
    this.ripples=[];this.rippleT=0;
    this.flies=[];this.flyT=0;
  }
  _genPads(n){
    const startX=this.pads.length>0?this.pads[this.pads.length-1].x+rnd(150,220):80;
    const cols=['#4caf50','#388e3c','#56b33a','#2e7d32'];
    for(let i=0;i<n;i++){
      const x=startX+i*rnd(150,230);
      const baseY=rnd(this.H*.35,this.H*.68);
      const w=rnd(72,115);
      const bobSpeed=rnd(0.6,1.6);
      const bobRange=rnd(30,80);
      this.pads.push({
        x,y:baseY,baseY,w,h:18,
        col:cols[ri(0,cols.length-1)],
        bobSpeed,bobRange,bobT:rnd(0,TAU),
        lilies:Array.from({length:ri(1,3)},()=>({ox:rnd(-w*.3,w*.3),bloom:Math.random()>.4}))
      });
    }
  }
  input(k){
    if((k==='action'||k==='up')&&!this.frog.jumping&&this.frog.onPad) this.jumpQueued=true;
  }
  _startJump(){
    const f=this.frog;
    const ni=f.padIdx+1;
    if(ni>=this.pads.length) return;
    const from=this.pads[f.padIdx],to=this.pads[ni];
    f.jumpFrom={x:from.x,y:from.y-22};
    f.jumpTo={x:to.x,y:to.y-22};
    f.jumping=true;f.onPad=false;f.jumpT=0;f.squish=1.35;
    SFX.play('jump');
    this.fx.burst(from.x-this.scrollX+this.W*.25,from.y,
      6,[C.cg,'#7ed957'],{sz:4,sMin:30,sMax:80,lMin:.2,lMax:.5,grav:180});
  }
  tick(dt){
    if(!this.alive)return;
    this.time+=dt;
    this.speed=80+this.score*7;
    this.scrollX+=this.speed*dt;
    // Bob pads
    for(const p of this.pads){
      p.bobT+=dt;
      p.y=p.baseY+Math.sin(p.bobT*p.bobSpeed)*p.bobRange;
    }
    // Cull old pads, generate new
    const camX=this.scrollX-this.W*.25;
    while(this.pads.length>0&&this.pads[0].x<camX-200){
      this.pads.shift();
      this.frog.padIdx=Math.max(0,this.frog.padIdx-1);
    }
    while(this.pads.length<12) this._genPads(4);
    // Frog anim
    this.frog.frameT+=dt;
    if(this.frog.frameT>.15){this.frog.frameT=0;this.frog.frame=(this.frog.frame+1)%2;}
    this.frog.squish=lerp(this.frog.squish,1,dt*10);
    // Jump
    if(this.jumpQueued&&!this.frog.jumping&&this.frog.onPad){this.jumpQueued=false;this._startJump();}
    if(this.frog.jumping){
      this.frog.jumpT=Math.min(1,this.frog.jumpT+dt*1.9);
      const t=this.frog.jumpT;
      const fr=this.frog.jumpFrom,to=this.frog.jumpTo;
      this.frog.x=lerp(fr.x,to.x,t);
      this.frog.y=lerp(fr.y,to.y,t)-Math.sin(t*Math.PI)*90;
      if(t>=1){
        this.frog.jumping=false;this.frog.onPad=true;
        this.frog.padIdx++;this.score++;this.frog.squish=0.6;
        SFX.play('coin');
        const lp=this.pads[this.frog.padIdx];
        this.fx.burst(lp.x-camX,lp.y,10,[C.cg,C.cy,'#fff'],
          {sz:5,sMin:40,sMax:130,lMin:.3,lMax:.8,grav:200,shape:'circle'});
      }
    } else if(this.frog.onPad){
      const pad=this.pads[this.frog.padIdx];
      if(pad){this.frog.x=pad.x;this.frog.y=pad.y-22;}
    }
    // Death: frog falls behind camera
    const fsx=this.frog.x-camX;
    if(fsx<-60){
      this.alive=false;this.sk.hit(14,.5);SFX.play('die');
      this.fx.burst(Math.max(20,fsx),this.frog.y,30,[C.cr,C.cy,C.cg],{sz:7,shape:'star',sMax:180});
      return;
    }
    // Flies
    this.flyT+=dt;
    if(this.flyT>2.2){
      this.flyT=0;
      const up=this.pads.filter(p=>p.x>this.scrollX+this.W*.2&&p.x<this.scrollX+this.W*.85);
      if(up.length>0){const p=up[ri(0,up.length-1)];this.flies.push({x:p.x,y:p.y-55,pulse:0,collected:false});}
    }
    for(const fl of this.flies){
      fl.pulse+=dt*4;
      const fx2=fl.x-camX,fsx2=this.frog.x-camX;
      if(!fl.collected&&Math.hypot(fsx2-fx2,this.frog.y-fl.y)<24){
        fl.collected=true;this.score++;SFX.play('bell');
        this.fx.burst(fx2,fl.y,14,[C.cy,C.co,'#fff'],{shape:'star',sz:5,sMax:120,lMax:.6});
      }
    }
    this.flies=this.flies.filter(fl=>!fl.collected&&fl.x>this.scrollX-100);
    // Ripples
    this.rippleT+=dt;
    if(this.rippleT>.55){this.rippleT=0;this.ripples.push({x:rnd(0,this.W),y:rnd(0.78,0.95),t:0});}
    this.ripples=this.ripples.filter(r=>{r.t+=dt;return r.t<.8;});
  }
  draw(ctx){
    const W=this.W,H=this.H;
    const camX=this.scrollX-W*.25;
    // Sky
    const sky=ctx.createLinearGradient(0,0,0,H*.55);
    sky.addColorStop(0,'#87CEEB');sky.addColorStop(1,'#C8EAF5');
    ctx.fillStyle=sky;ctx.fillRect(0,0,W,H*.55);
    // Bg trees
    ctx.fillStyle='#5ab347';
    for(let i=0;i<9;i++){
      const bx=((i*200-(camX*.07))%W+W)%W;
      ctx.beginPath();ctx.arc(bx,H*.49,26+i%3*9,0,TAU);ctx.fill();
      ctx.beginPath();ctx.arc(bx+20,H*.5+8,18+i%2*7,0,TAU);ctx.fill();
    }
    // Water
    const wY=H*.55;
    const wg=ctx.createLinearGradient(0,wY,0,H);
    wg.addColorStop(0,'#2a8fbf');wg.addColorStop(1,'#1a6090');
    ctx.fillStyle=wg;ctx.fillRect(0,wY,W,H-wY);
    // Shimmer
    ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1;
    for(let i=0;i<5;i++){
      ctx.beginPath();
      for(let x=0;x<=W;x+=50){
        const wy=wY+18+i*20+Math.sin((x+this.time*50+i*25)*.035)*5;
        x===0?ctx.moveTo(x,wy):ctx.lineTo(x,wy);
      }
      ctx.stroke();
    }
    // Ripples
    for(const r of this.ripples){
      const rr=4+r.t*28;
      ctx.strokeStyle=`rgba(255,255,255,${.28*(1-r.t/.8)})`;
      ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(r.x,wY+10+r.y*(H-wY-20),rr,0,TAU);ctx.stroke();
    }
    // Lily pads
    for(const p of this.pads){
      const sx=p.x-camX;
      if(sx<-p.w-10||sx>W+p.w+10) continue;
      // Shadow
      ctx.fillStyle='rgba(0,0,0,.14)';
      ctx.beginPath();ctx.ellipse(sx+3,p.y+8,p.w/2+4,7,0,0,TAU);ctx.fill();
      // Pad
      ctx.fillStyle=p.col;
      ctx.beginPath();ctx.ellipse(sx,p.y,p.w/2,p.h/2,0,0,TAU);ctx.fill();
      ctx.strokeStyle='rgba(26,16,8,.28)';ctx.lineWidth=2;ctx.stroke();
      // Shine

      ctx.beginPath();ctx.ellipse(sx-p.w*.12,p.y-p.h*.1,p.w*.22,p.h*.18,-.3,0,TAU);ctx.fill();
      // Notch
      ctx.fillStyle=p.col;
      ctx.beginPath();ctx.moveTo(sx,p.y);ctx.lineTo(sx-5,p.y-p.h*.5-3);ctx.lineTo(sx+5,p.y-p.h*.5-3);ctx.closePath();ctx.fill();
      // Flowers
      for(const li of p.lilies){
        const fx2=sx+li.ox,fy=p.y-p.h*.5-2;
        if(li.bloom){
          for(let i=0;i<5;i++){const pa=i*TAU/5;ctx.fillStyle='#ffaacc';ctx.beginPath();ctx.ellipse(fx2+Math.cos(pa)*5,fy+Math.sin(pa)*5,4,3,pa,0,TAU);ctx.fill();}
          ctx.fillStyle='#fff176';ctx.beginPath();ctx.arc(fx2,fy,3,0,TAU);ctx.fill();
        } else {
          ctx.fillStyle='#ffccdd';ctx.beginPath();ctx.arc(fx2,fy,4,0,TAU);ctx.fill();
        }
      }
    }
    // Flies
    for(const fl of this.flies){
      if(fl.collected) continue;
      const fx2=fl.x-camX,fy=fl.y;
      const pulse=.82+.18*Math.sin(fl.pulse);
      ctx.save();ctx.translate(fx2,fy);ctx.scale(pulse,pulse);
      ctx.fillStyle='#333';ctx.beginPath();ctx.ellipse(0,0,5,7,0,0,TAU);ctx.fill();
      ctx.fillStyle='rgba(200,230,255,.7)';
      ctx.beginPath();ctx.ellipse(-7,-3,6,4,-.4,0,TAU);ctx.fill();
      ctx.beginPath();ctx.ellipse(7,-3,6,4,.4,0,TAU);ctx.fill();
      ctx.fillStyle='#f00';ctx.beginPath();ctx.arc(-2,-5,1.5,0,TAU);ctx.fill();
      ctx.beginPath();ctx.arc(2,-5,1.5,0,TAU);ctx.fill();
      ctx.restore();
      ctx.fillStyle='rgba(255,220,0,.65)';ctx.font='10px serif';
      ctx.textAlign='center';ctx.fillText('✦',fx2,fy-14);ctx.textAlign='left';
    }
    // Frog
    const fsx=this.frog.x-camX,fsy=this.frog.y;
    const sqX=clamp(this.frog.squish<1?2-this.frog.squish:this.frog.squish,.5,1.8);
    const sqY=clamp(this.frog.squish<1?this.frog.squish:2-this.frog.squish,.4,1.5);
    // Jump arc dots
    if(this.frog.jumping){
      const fr=this.frog.jumpFrom,to=this.frog.jumpTo;
      for(let i=1;i<8;i++){
        const t2=i/8;
        const ax=lerp(fr.x,to.x,t2)-camX;
        const ay=lerp(fr.y,to.y,t2)-Math.sin(t2*Math.PI)*90;
        ctx.fillStyle=`rgba(255,200,0,${.5-i*.05})`;
        ctx.beginPath();ctx.arc(ax,ay,3-i*.28,0,TAU);ctx.fill();
      }
    }
    ctx.save();ctx.translate(fsx,fsy);ctx.scale(sqX,sqY);
    // Shadow
    ctx.fillStyle='rgba(0,0,0,.16)';ctx.beginPath();ctx.ellipse(0,16,13,5,0,0,TAU);ctx.fill();
    // Body
    ctx.fillStyle='#4CAF50';ctx.strokeStyle='#2e7d32';ctx.lineWidth=2;
    ctx.beginPath();ctx.ellipse(0,0,16,13,0,0,TAU);ctx.fill();ctx.stroke();
    // Belly
    ctx.fillStyle='#a5d6a7';ctx.beginPath();ctx.ellipse(0,3,10,8,0,0,TAU);ctx.fill();
    // Eyes
    [[-7,-10],[7,-10]].forEach(([ex,ey])=>{
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex,ey,6,0,TAU);ctx.fill();
      ctx.strokeStyle='#2e7d32';ctx.lineWidth=1.5;ctx.stroke();
      ctx.fillStyle='#111';ctx.beginPath();ctx.arc(ex+(this.frog.jumping?.5:0),ey,3,0,TAU);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex+1,ey-1,1,0,TAU);ctx.fill();
    });
    // Mouth
    ctx.strokeStyle='#2e7d32';ctx.lineWidth=2;
    if(this.frog.jumping){ctx.beginPath();ctx.arc(0,4,5,0,TAU);ctx.stroke();}
    else{ctx.beginPath();ctx.arc(0,2,7,0,Math.PI);ctx.stroke();}
    // Legs
    const ls=this.frog.jumping?22:10+this.frog.frame*3;
    [[-1],[1]].forEach(([sx2])=>{
      ctx.strokeStyle='#388e3c';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(sx2*10,8);ctx.quadraticCurveTo(sx2*ls,20,sx2*(ls-5),15);ctx.stroke();
      ctx.fillStyle='#388e3c';ctx.beginPath();ctx.ellipse(sx2*(ls-5),15,5,3,sx2*.4,0,TAU);ctx.fill();
      ctx.strokeStyle='#2e7d32';ctx.lineWidth=1;ctx.stroke();
    });
    ctx.restore();
    // HUD bottom
    txt(ctx,`PADS: ${this.score}`,10,H-12,{font:'12px "Boogaloo",cursive',col:'rgba(255,255,255,.65)'});
    const dist=Math.floor(this.scrollX/50);
    txt(ctx,`${dist}m`,W-50,H-12,{font:'12px "Boogaloo",cursive',col:'rgba(255,255,255,.65)'});
  }
}

// ═══════════════════════════════════════
//  GAME 05 — DODGE CLOWN 🤡

class DodgeClown{
  hint='← → / A D / DPAD — Dodge the clown\'s throws!';
  vCtrl='dpad-lr'; // only left/right
  constructor(W,H,fx,sk){this.W=W;this.H=H;this.fx=fx;this.sk=sk;this.reset();}
  reset(){
    this.score=0;this.alive=true;this.time=0;this.pl={x:this.W/2-20,y:this.H-80,w:40,h:50};
    this.cl={x:this.W/2,y:55,arm:0};this.projs=[];this.throwT=0;this.throwI=1.8;this.lft=false;this.rgt=false;
  }
  input(k){
    if(k==='left'||k==='a')this.lft=true;if(k==='right'||k==='d')this.rgt=true;
    if(k==='leftUp'||k==='aUp')this.lft=false;if(k==='rightUp'||k==='dUp')this.rgt=false;
  }
  tick(dt){
    if(!this.alive)return;this.time+=dt;this.score=Math.floor(this.time);
    this.throwI=Math.max(.58,1.8-this.time*.018);const spd=200+this.time*4;
    if(this.lft)this.pl.x-=spd*dt;if(this.rgt)this.pl.x+=spd*dt;
    this.pl.x=clamp(this.pl.x,0,this.W-this.pl.w);
    this.cl.arm+=dt*2.5;this.throwT+=dt;
    if(this.throwT>=this.throwI){
      this.throwT=0;const tx=this.pl.x+this.pl.w/2,ty=this.pl.y;
      const ang=Math.atan2(ty-this.cl.y,tx-this.cl.x),s=190+this.time*9;
      SFX.play('whoosh');
      this.projs.push({x:this.cl.x,y:this.cl.y,vx:Math.cos(ang)*s,vy:Math.sin(ang)*s,r:15,emoji:['🥧','🥚','💣','🪄','🎈','🍅'][ri(0,5)],rot:0});
    }
    for(const p of this.projs){
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*6;
      const ph={x:this.pl.x+7,y:this.pl.y+12,w:this.pl.w-14,h:this.pl.h-16};
      if(dst({x:p.x,y:p.y},{x:ph.x+ph.w/2,y:ph.y+ph.h/2})<p.r+13){
        this.alive=false;this.sk.hit(15,.5);SFX.play('die');
        this.fx.burst(this.pl.x+this.pl.w/2,this.pl.y+this.pl.h/2,35,PAL,{sz:8,shape:'star',sMax:200});return;
      }
    }
    this.projs=this.projs.filter(p=>p.y<this.H+60&&p.x>-60&&p.x<this.W+60);
  }
  draw(ctx){
    const W=this.W,H=this.H,pl=this.pl,cl=this.cl;
    ctx.fillStyle='#FFF5E1';ctx.fillRect(0,0,W,H);
    for(let i=0;i<Math.ceil(W/60)+1;i++){ctx.fillStyle=i%2?'rgba(245,196,0,.06)':'rgba(232,35,42,.07)';ctx.fillRect(i*60,0,60,H);}
    const tri=Math.floor(W/32)+1;
    for(let i=0;i<tri;i++){ctx.fillStyle=i%2?C.cy:C.cr;ctx.beginPath();ctx.moveTo(i*32,0);ctx.lineTo((i+1)*32,0);ctx.lineTo(i*32+16,27);ctx.closePath();ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=1.5;ctx.stroke();}
    ctx.font='44px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🤡',cl.x,cl.y);
    ctx.save();ctx.translate(cl.x,cl.y);ctx.rotate(Math.sin(cl.arm)*.5);ctx.strokeStyle=C.ink;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(32,22);ctx.stroke();ctx.restore();
    for(const p of this.projs){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.font='28px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(p.emoji,0,0);ctx.restore();}
    ctx.save();ctx.fillStyle='rgba(26,16,8,.12)';ctx.beginPath();ctx.ellipse(pl.x+pl.w/2,pl.y+pl.h+4,pl.w/2,8,0,0,TAU);ctx.fill();
    box(ctx,pl.x+6,pl.y+22,pl.w-12,pl.h-24,C.cb);
    ctx.fillStyle=C.ink;ctx.fillRect(pl.x+8,pl.y,pl.w-16,14);ctx.fillRect(pl.x+4,pl.y+12,pl.w-8,6);
    ctx.fillStyle='#FFCBA4';ctx.beginPath();ctx.arc(pl.x+pl.w/2,pl.y+19,10,0,TAU);ctx.fill();
    ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(pl.x+pl.w/2-3,pl.y+17,2,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(pl.x+pl.w/2+3,pl.y+17,2,0,TAU);ctx.fill();
    ctx.fillStyle=C.cr;ctx.beginPath();ctx.arc(pl.x+pl.w/2,pl.y+22,2,0,TAU);ctx.fill();
    ctx.restore();ctx.textAlign='left';
  }
}

// ═══════════════════════════════════════
//  GAME 06 — CANDY FLAP 🍭
// ═══════════════════════════════════════
class CandyFlap{
  hint='TAP / SPACE — Flip gravity!';
  vCtrl='tap';
  constructor(W,H,fx,sk){this.W=W;this.H=H;this.fx=fx;this.sk=sk;this.reset();}
  reset(){
    this.pl={x:100,y:this.H/2,w:28,h:20,vy:0};this.grav=580;this.gd=1;
    this.pipes=[];this.pT=0;this.pI=1.8;this.spd=185;this.score=0;this.alive=true;
    this.started=false;this.time=0;this.trail=[];this.bgH=ri(0,360);
  }
  input(k){if(k==='action'||k==='up'){if(!this.started)this.started=true;this.gd*=-1;this.pl.vy=0;SFX.play('jump');}}
  tick(dt){
    if(!this.alive||!this.started)return;
    this.time+=dt;this.spd=185+this.time*6;this.pI=Math.max(1.1,1.8-this.time*.01);this.bgH=(this.bgH+18*dt)%360;
    this.pl.vy+=this.grav*this.gd*dt;this.pl.vy=clamp(this.pl.vy,-480,480);this.pl.y+=this.pl.vy*dt;
    this.trail.unshift({x:this.pl.x,y:this.pl.y+this.pl.h/2});if(this.trail.length>14)this.trail.pop();
    if(this.pl.y<0||this.pl.y+this.pl.h>this.H){this.die();return;}
    this.pT+=dt;
    if(this.pT>=this.pI){this.pT=0;const gap=140+Math.sin(this.time)*18;const th=rnd(40,this.H-gap-40);this.pipes.push({x:this.W,th,gap,w:30,scored:false,col:PAL[ri(0,7)]});}
    for(const p of this.pipes){
      p.x-=this.spd*dt;if(!p.scored&&p.x+p.w<this.pl.x){p.scored=true;this.score++;SFX.play('score');}
      if(aabb(this.pl,{x:p.x-2,y:0,w:p.w+4,h:p.th})||aabb(this.pl,{x:p.x-2,y:p.th+p.gap,w:p.w+4,h:this.H-p.th-p.gap})){this.die();return;}
    }
    this.pipes=this.pipes.filter(p=>p.x+p.w>-10);
  }
  die(){this.alive=false;this.sk.hit(13,.45);SFX.play('die');this.fx.burst(this.pl.x+this.pl.w/2,this.pl.y+this.pl.h/2,30,[C.cr,C.cy,C.cp,C.cg],{sz:7,shape:'circle',sMax:180});}
  draw(ctx){
    const W=this.W,H=this.H,pl=this.pl;
    const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,`hsl(${this.bgH},65%,90%)`);bg.addColorStop(1,`hsl(${(this.bgH+55)%360},58%,85%)`);ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
    ctx.save();ctx.globalAlpha=.06;for(let i=0;i<W/20+H/20+4;i++){ctx.fillStyle=i%2?C.cr:C.cb;ctx.save();ctx.translate(i*20-H,0);ctx.rotate(.52);ctx.fillRect(-4,-10,11,H*3);ctx.restore();}ctx.restore();
    for(const p of this.pipes){
      const dp=(x,y,w,h)=>{for(let i=0;i<Math.ceil(h/14)+1;i++){ctx.fillStyle=i%2?'#FFF5E1':p.col;ctx.fillRect(x,y+i*14,w,Math.min(14,h-i*14));}ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);ctx.fillStyle='rgba(26,16,8,.5)';if(h>0){ctx.fillRect(x-5,y+h-12,w+10,14);ctx.strokeRect(x-5,y+h-12,w+10,14);}};
      dp(p.x,0,p.w,p.th);dp(p.x,p.th+p.gap,p.w,H-p.th-p.gap);
    }
    for(let i=0;i<this.trail.length;i++){const tr=this.trail[i];ctx.globalAlpha=(1-i/this.trail.length)*.5;ctx.fillStyle=`hsl(${(this.bgH+i*18)%360},80%,60%)`;ctx.beginPath();ctx.arc(tr.x+pl.w/2,tr.y,5-i*.3,0,TAU);ctx.fill();}
    ctx.globalAlpha=1;
    ctx.save();ctx.translate(pl.x+pl.w/2,pl.y+pl.h/2);if(this.gd===-1)ctx.rotate(Math.PI);
    ctx.strokeStyle=C.cv;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,20);ctx.stroke();
    circ(ctx,0,-2,14,C.cr);ctx.fillStyle=C.cy;ctx.beginPath();ctx.arc(-4,-6,5,0,TAU);ctx.fill();ctx.restore();
    if(!this.started){ctx.fillStyle='rgba(26,16,8,.72)';ctx.fillRect(W/2-155,H/2-38,310,66);txt(ctx,'TAP TO START!',W/2,H/2-13,{font:'18px "Fredoka One",cursive',col:C.cy,align:'center'});txt(ctx,'tap = flip gravity',W/2,H/2+12,{font:'12px "Boogaloo",cursive',col:'rgba(255,245,225,.55)',align:'center'});}
  }
}

// ═══════════════════════════════════════
//  GAME 07 — WHACK-A-MOLE 🦔
// ═══════════════════════════════════════
class WhackMole{
  hint='TAP / CLICK moles! Avoid bombs! 30 seconds.';
  vCtrl='tap';
  constructor(W,H,fx,sk){this.W=W;this.H=H;this.fx=fx;this.sk=sk;this.reset();}
  reset(){
    this.score=0;this.alive=true;this.time=0;this.tLeft=30;
    const cw=this.W/3,rh=(this.H-50)/3;this.holes=[];
    for(let r=0;r<3;r++)for(let c=0;c<3;c++)this.holes.push({cx:c*cw+cw/2,cy:50+r*rh+rh/2+10,r:38,active:false,timer:0,dur:1.5,pop:0,type:'mole',hitF:0});
    this.nT=0;this.nI=1.0;
  }
  click(mx,my){
    for(const h of this.holes){
      if(!h.active)continue;
      if(dst({x:mx,y:my},{x:h.cx,y:h.cy})<h.r+12){
        h.active=false;h.hitF=.28;
        const pts=h.type==='mole'?1:-3;this.score=Math.max(0,this.score+pts);
        this.fx.burst(h.cx,h.cy,16,PAL,{shape:'star',sz:7,sMax:150});
        this.sk.hit(6,.15);
        SFX.play(h.type==='mole'?'mole':'wrong');
      }
    }
  }
  tick(dt){
    if(!this.alive)return;this.time+=dt;this.tLeft=Math.max(0,30-this.time);
    if(this.tLeft<=0){this.alive=false;SFX.play('bell');return;}
    this.nI=Math.max(.44,1.0-this.time*.016);this.nT+=dt;
    if(this.nT>=this.nI){this.nT=0;const inactive=this.holes.filter(h=>!h.active);
      if(inactive.length){const h=inactive[ri(0,inactive.length-1)];h.active=true;h.timer=0;h.pop=0;const bomb=Math.random()<.14+this.time*.005;h.type=bomb?'bomb':'mole';h.dur=rnd(.85,2);}}
    for(const h of this.holes){if(h.hitF>0)h.hitF-=dt;if(!h.active)continue;h.timer+=dt;const half=h.dur/2;h.pop=clamp(h.timer<half?h.timer/half:1-(h.timer-half)/half,0,1);if(h.timer>=h.dur)h.active=false;}
  }
  draw(ctx){
    const W=this.W,H=this.H;ctx.fillStyle='#5cb85c';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(60,140,60,.28)';ctx.lineWidth=1;for(let y=0;y<H;y+=12){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    const pct=this.tLeft/30;ctx.fillStyle='rgba(26,16,8,.22)';ctx.fillRect(10,10,W-20,15);ctx.fillStyle=pct>.4?C.cg:pct>.2?C.cy:C.cr;ctx.fillRect(10,10,(W-20)*pct,15);ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.strokeRect(10,10,W-20,15);
    txt(ctx,`⏱ ${Math.ceil(this.tLeft)}s`,W/2,17,{font:'12px "Fredoka One",cursive',col:'#FFF5E1',align:'center'});
    for(const h of this.holes){
      ctx.fillStyle='#6b4226';ctx.beginPath();ctx.ellipse(h.cx,h.cy+14,h.r+10,22,0,0,TAU);ctx.fill();ctx.strokeStyle='#3d200e';ctx.lineWidth=2;ctx.stroke();
      const popH=h.pop*(h.r*1.7);
      // Draw mole ABOVE the hole, not clipped inside it
      ctx.save();
      if((h.active||h.hitF>0)&&h.pop>.01){
        if(h.hitF>0){
          ctx.fillStyle=C.cy;ctx.beginPath();ctx.arc(h.cx,h.cy-popH+h.r,h.r+10,0,TAU);ctx.fill();
        }
        const moleY=h.cy+14-popH;
        ctx.font=`${Math.min(h.r*1.6*h.pop+10,h.r*2)}px serif`;
        ctx.textAlign='center';ctx.textBaseline='bottom';
        ctx.fillText(h.type==='mole'?'🦔':'💣',h.cx,moleY);
      }
      ctx.restore();
    }
  }
}

// ═══════════════════════════════════════
//  GAME 08 — PONG SOLO 🏓
// ═══════════════════════════════════════
class PongSolo{
  hint='DRAG / MOUSE — Move paddle. Break all bricks!';
  vCtrl='touch';
  constructor(W,H,fx,sk){this.W=W;this.H=H;this.fx=fx;this.sk=sk;this.reset();}
  reset(){
    this.score=0;this.alive=true;this.pad={x:this.W/2-55,y:this.H-38,w:110,h:13};
    this.ball={x:this.W/2,y:this.H/2,r:9,vx:rnd(-130,130)||80,vy:220};
    this.bricks=[];this.genB();this.mx=this.W/2;this.combo=0;
  }
  genB(){const palB=[C.cr,C.cy,C.cb,C.cg,C.cp,C.co];for(let r=0;r<4;r++)for(let c=0;c<8;c++)this.bricks.push({x:c*96+10,y:r*26+55,w:88,h:18,col:palB[(r+c)%6],alive:true});}
  mm(x){this.mx=x;}
  tick(dt){
    if(!this.alive)return;this.pad.x=clamp(this.mx-this.pad.w/2,0,this.W-this.pad.w);
    const b=this.ball;b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx);}if(b.x+b.r>this.W){b.x=this.W-b.r;b.vx=-Math.abs(b.vx);}
    if(b.y-b.r<0){b.y=b.r;b.vy=Math.abs(b.vy);}
    if(b.y-b.r>this.H+20){this.alive=false;this.sk.hit(14,.5);SFX.play('die');this.fx.burst(b.x,this.H-20,25,PAL,{sz:7,shape:'circle'});return;}
    const pd=this.pad;
    if(b.vy>0&&b.y+b.r>pd.y&&b.y+b.r<pd.y+pd.h+16&&b.x>pd.x-b.r&&b.x<pd.x+pd.w+b.r){
      b.vy=-Math.abs(b.vy)*1.02;b.vx+=(b.x-(pd.x+pd.w/2))*2.8;b.vx=clamp(b.vx,-420,420);b.vy=clamp(b.vy,-520,-100);
      this.score++;this.combo++;SFX.play('hit');this.fx.burst(b.x,pd.y,8,[C.cy,'#FFF'],{shape:'circle',sz:4,sMax:90,lMax:.4});
    }
    for(const br of this.bricks){if(!br.alive)continue;if(b.x>br.x-b.r&&b.x<br.x+br.w+b.r&&b.y>br.y-b.r&&b.y<br.y+br.h+b.r){br.alive=false;this.score+=2;this.combo++;SFX.play('pop');this.fx.burst(br.x+br.w/2,br.y+br.h/2,12,[br.col,'#FFF'],{shape:'rect',sz:5,sMax:140});if(b.x<br.x||b.x>br.x+br.w)b.vx*=-1;else b.vy*=-1;break;}}

// ═══════════════════════════════════════
//  GAME 10 — MEMORY FLASH 🃏
// ═══════════════════════════════════════
class MemoryFlash{
  hint='Watch, then tap tiles in the same order!';
  vCtrl='tap';
  constructor(W,H,fx,sk){this.W=W;this.H=H;this.fx=fx;this.sk=sk;this.reset();}
  reset(){
    this.score=0;this.alive=true;
    this.tiles=[{col:C.cr,label:'RED'},{col:C.cy,label:'YEL'},{col:C.cb,label:'BLU'},{col:C.cg,label:'GRN'}];
    this.tiles.forEach(t=>{t.x=0;t.y=0;t.w=0;t.h=0;});
    this.seq=[];this.playerSeq=[];this.phase='showing';this.showIdx=0;this.showT=0;this.showDur=.55;this.lit=-1;this.litT=0;this.delayT=.8;this._addStep();
  }
  _addStep(){this.seq.push(ri(0,3));this.playerSeq=[];this.phase='showing';this.showIdx=0;this.showT=0;this.lit=-1;this.delayT=.4;}
  click(mx,my){
    if(this.phase!=='waiting')return;
    for(let i=0;i<4;i++){const t=this.tiles[i];if(mx>=t.x&&mx<t.x+t.w&&my>=t.y&&my<t.y+t.h){
      this.lit=i;this.litT=.25;this.playerSeq.push(i);
      this.fx.burst(t.x+t.w/2,t.y+t.h/2,8,[t.col,'#FFF'],{shape:'circle',sz:5,sMax:100,lMax:.5});
      if(this.playerSeq[this.playerSeq.length-1]!==this.seq[this.playerSeq.length-1]){this.alive=false;this.sk.hit(14,.5);SFX.play('wrong');this.fx.burst(this.W/2,this.H/2,40,PAL,{sz:8,shape:'star',sMax:250});return;}
      SFX.play('tick');
      if(this.playerSeq.length===this.seq.length){this.score++;SFX.play('good');this.phase='pause';setTimeout(()=>this._addStep(),600);}
      return;
    }}
  }
  tick(dt){
    if(!this.alive)return;if(this.litT>0)this.litT-=dt;
    if(this.phase==='showing'){if(this.delayT>0){this.delayT-=dt;return;}this.showT+=dt;if(this.lit===-1){this.lit=this.seq[this.showIdx];this.litT=this.showDur*.7;SFX.play('tick');}if(this.showT>=this.showDur){this.showT=0;this.lit=-1;this.showIdx++;if(this.showIdx>=this.seq.length){this.phase='waiting';this.lit=-1;}else setTimeout(()=>{this.lit=this.seq[this.showIdx];this.litT=this.showDur*.7;SFX.play('tick');},80);}}
  }
  _layout(W,H){const pad=16,gap=10,tw=(W-pad*2-gap)/2,th=(H-pad*2-gap)/2;this.tiles[0]={...this.tiles[0],x:pad,y:pad,w:tw,h:th};this.tiles[1]={...this.tiles[1],x:pad+tw+gap,y:pad,w:tw,h:th};this.tiles[2]={...this.tiles[2],x:pad,y:pad+th+gap,w:tw,h:th};this.tiles[3]={...this.tiles[3],x:pad+tw+gap,y:pad+th+gap,w:tw,h:th};}
  draw(ctx){
    const W=this.W,H=this.H;this._layout(W,H);ctx.fillStyle='#1a1008';ctx.fillRect(0,0,W,H);
    for(let i=0;i<4;i++){const t=this.tiles[i],lit=(this.lit===i&&this.litT>0);ctx.fillStyle=lit?t.col:'rgba(26,16,8,.5)';ctx.fillRect(t.x,t.y,t.w,t.h);if(lit){ctx.shadowBlur=28;ctx.shadowColor=t.col;}ctx.strokeStyle=t.col;ctx.lineWidth=3;ctx.strokeRect(t.x,t.y,t.w,t.h);ctx.shadowBlur=0;if(!lit){ctx.fillStyle=t.col;ctx.globalAlpha=.22;ctx.fillRect(t.x,t.y,t.w,t.h);ctx.globalAlpha=1;}txt(ctx,t.label,t.x+t.w/2,t.y+t.h/2,{font:`${Math.min(t.w*.22,28)}px "Fredoka One",cursive`,col:lit?'#FFF':t.col,align:'center'});}
    ctx.fillStyle='rgba(26,16,8,.72)';ctx.fillRect(0,H/2-18,W,35);
    const st=this.phase==='showing'?`WATCH: ${this.showIdx+1}/${this.seq.length}`:this.phase==='waiting'?`YOUR TURN: ${this.playerSeq.length}/${this.seq.length}`:'✓ PERFECT!';
    txt(ctx,st,W/2,H/2,{font:'14px "Fredoka One",cursive',col:C.cy,align:'center'});
    for(let i=0;i<this.seq.length;i++){ctx.fillStyle=i<this.playerSeq.length?C.cg:'rgba(255,255,255,.18)';ctx.beginPath();ctx.arc(W/2-((this.seq.length-1)*8)+i*16,H/2+20,5,0,TAU);ctx.fill();}
  }
}

// ═══════════════════════════════════════
//  GAME 11 — GRAVITY BALL ⚽
//  Gyroscope on mobile, mouse on desktop
// ═══════════════════════════════════════
class GravityBall{
  hint='TILT PHONE / MOVE MOUSE — Roll ball into hole!';
  vCtrl='touch';
  constructor(W,H,fx,sk){this.W=W;this.H=H;this.fx=fx;this.sk=sk;this.reset();this._gyro=false;this._setupGyro();}
  _setupGyro(){
    if(typeof DeviceOrientationEvent==='undefined') return;
    const handler=(e)=>{
      if(e.gamma===null) return;
      this._gyro=true;
      // gamma = left/right tilt (-90 to 90), beta = front/back
      this.mx=this.W/2+clamp(e.gamma/45,-.9,.9)*this.W/2;
      this.my=this.H/2+clamp((e.beta-30)/45,-.9,.9)*this.H/2;
    };
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      // iOS 13+: need permission
      this._needsPerm=true;
    } else {
      window.addEventListener('deviceorientation',handler);
    }
  }
  requestGyro(){
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')this._setupGyro2();});
    }
  }
  _setupGyro2(){
    window.addEventListener('deviceorientation',(e)=>{
      if(e.gamma===null) return;this._gyro=true;
      this.mx=this.W/2+clamp(e.gamma/45,-.9,.9)*this.W/2;
      this.my=this.H/2+clamp((e.beta-30)/45,-.9,.9)*this.H/2;
    });
  }
  reset(){
    this.score=0;this.alive=true;this.time=0;this.ball={x:this.W/2,y:this.H/3,r:14,vx:0,vy:0};
    this.mx=this.W/2;this.my=this.H/2;this.tiltX=0;this.tiltY=0;this.holes=[];this.walls=[];
    this.level=0;this.winFlash=0;this._gen();
  }
  _gen(){this.holes=[];this.walls=[];const mg=44;this.holes.push({x:rnd(mg,this.W-mg),y:rnd(mg+50,this.H-mg),r:20});const nw=2+Math.min(this.level,5);for(let i=0;i<nw;i++)this.walls.push({x:rnd(30,this.W-70),y:rnd(60,this.H-60),w:rnd(40,110),h:10,ang:rnd(-.5,.5)});}
  mm(x,y){if(!this._gyro){this.mx=x;this.my=y;}}
  tick(dt){
    if(!this.alive)return;this.time+=dt;if(this.winFlash>0){this.winFlash-=dt;return;}
    this.tiltX=clamp((this.mx-this.W/2)/this.W*12,-6,6);this.tiltY=clamp((this.my-this.H/2)/this.H*12,-6,6);
    const b=this.ball;b.vx+=this.tiltX*60*dt;b.vy+=this.tiltY*60*dt;b.vx*=.97;b.vy*=.97;b.x+=b.vx*dt*60;b.y+=b.vy*dt*60;
    if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.6;}if(b.x>this.W-b.r){b.x=this.W-b.r;b.vx=-Math.abs(b.vx)*.6;}if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*.6;}if(b.y>this.H-b.r){b.y=this.H-b.r;b.vy=-Math.abs(b.vy)*.6;}
    for(const h of this.holes){if(dst(b,h)<h.r-4){this.score++;this.winFlash=.55;SFX.play('good');this.fx.burst(h.x,h.y,30,PAL,{shape:'star',sz:8,sMax:180});this.sk.hit(5,.2);this.level++;setTimeout(()=>{this.ball.x=this.W/2;this.ball.y=this.H/4;this.ball.vx=0;this.ball.vy=0;this._gen();},480);break;}}
    for(const w of this.walls){const wx=Math.cos(w.ang),wy=Math.sin(w.ang),nx=-wy,ny=wx;const dx=b.x-w.x,dy=b.y-w.y;const along=dx*wx+dy*wy,perp=dx*nx+dy*ny;if(along>-b.r&&along<w.w+b.r&&Math.abs(perp)<w.h/2+b.r){const dot=b.vx*nx+b.vy*ny;if(dot*perp<0){b.vx-=2*dot*nx;b.vy-=2*dot*ny;b.vx*=.7;b.vy*=.7;}const push=w.h/2+b.r-Math.abs(perp);b.x+=nx*push*(perp<0?-1:1);b.y+=ny*push*(perp<0?-1:1);}}
  }
  draw(ctx){
    const W=this.W,H=this.H;ctx.fillStyle='#c8a46e';ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(160,100,40,.28)';ctx.lineWidth=2;for(let y=0;y<H;y+=18){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+Math.sin(y*.1)*4);ctx.stroke();}
    for(const w of this.walls){ctx.save();ctx.translate(w.x,w.y);ctx.rotate(w.ang);ctx.fillStyle='rgba(26,16,8,.15)';ctx.fillRect(3,3,w.w,w.h);ctx.fillStyle=C.ink;ctx.fillRect(0,0,w.w,w.h);ctx.restore();}
    for(const h of this.holes){ctx.save();ctx.shadowBlur=this.winFlash>.3?18:8;ctx.shadowColor='#000';ctx.fillStyle='#1a1008';ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,TAU);ctx.fill();ctx.restore();ctx.strokeStyle=this.winFlash>.3?C.cy:C.co;ctx.lineWidth=2;ctx.beginPath();ctx.arc(h.x,h.y,h.r,0,TAU);ctx.stroke();}
    const b=this.ball;circ(ctx,b.x,b.y,b.r,PAL[this.level%PAL.length]);
    // tilt indicator
    ctx.fillStyle='rgba(26,16,8,.28)';ctx.beginPath();ctx.arc(W/2,20,9,0,TAU);ctx.fill();ctx.fillStyle=C.cy;ctx.beginPath();ctx.arc(W/2+this.tiltX*1.3,20+this.tiltY*1.3,5,0,TAU);ctx.fill();
    if(this._gyro){txt(ctx,'📱 TILT',W-70,H-14,{font:'11px "Boogaloo",cursive',col:'rgba(26,16,8,.4)'});}
    if(this.winFlash>0){ctx.fillStyle=`rgba(245,196,0,${this.winFlash*1.1})`;ctx.fillRect(0,0,W,H);}
  }
}

    this.spT+=dt;if(this.spT>=this.spI){this.spT=0;const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ';const ch=chars[ri(0,25)];this.letters.push({x:rnd(30,this.W-30),y:-30,ch,col:PAL[ri(0,7)],vy:this.speed,hit:false,hitT:0,wob:rnd(0,TAU),ws:rnd(.5,2)});}
    for(const l of this.letters){if(l.hit){l.hitT-=dt;continue;}l.y+=l.vy*dt;l.wob+=l.ws*dt;l.x+=Math.sin(l.wob)*.5;if(l.y>this.H+20){this.lives--;SFX.play('hit');this.sk.hit(8,.25);this.combo=0;if(this.lives<=0){this.alive=false;this.sk.hit(14,.5);SFX.play('die');}}}

    ctx.fillStyle='rgba(232,35,42,.07)';ctx.fillRect(0,H-36,W,36);ctx.strokeStyle='rgba(232,35,42,.28)';ctx.lineWidth=2;ctx.setLineDash([6,6]);ctx.beginPath();ctx.moveTo(0,H-36);ctx.lineTo(W,H-36);ctx.stroke();ctx.setLineDash([]);
    for(const l of this.letters){
      if(l.hit){const sc=1+((.28-l.hitT)/.28)*2;ctx.save();ctx.translate(l.x,l.y);ctx.scale(sc,sc);ctx.globalAlpha=l.hitT/.28;ctx.font='bold 36px "Fredoka One",cursive';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=l.col;ctx.fillText(l.ch,0,0);ctx.restore();continue;}
      ctx.save();ctx.shadowBlur=12;ctx.shadowColor=l.col;ctx.font='bold 32px "Fredoka One",cursive';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#FFF5E1';ctx.fillText(l.ch,l.x,l.y);ctx.strokeStyle=l.col;ctx.lineWidth=2;ctx.strokeText(l.ch,l.x,l.y);ctx.restore();

      ctx.bezierCurveTo(hx,hy+8,hx+10,hy+2,hx+10,hy-2);
      ctx.bezierCurveTo(hx+10,hy-8,hx,hy,hx,hy+4);
      ctx.closePath();ctx.fill();
      if(alive){ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.ellipse(hx-3,hy-1,3,2,-.5,0,TAU);ctx.fill();}
      ctx.restore();
    }
  }
}

// ═══════════════════════════════════════
//  DEFS
// ═══════════════════════════════════════
const DEFS=[
  {key:'balloon',name:'Balloon Pop',  icon:'🎈',col:C.cr,cls:BalloonPop, badge:'TAP!'},
  {key:'snake',  name:'Ribbon Snake', icon:'🎀',col:C.cp,cls:RibbonSnake,badge:null},
  {key:'stack',  name:'Stack Master', icon:'🎪',col:C.cb,cls:StackMaster,badge:null},
  {key:'frog',   name:'Frog Jump',    icon:'🐸',col:C.cg,cls:FrogJump,  badge:'NEW'},
  {key:'clown',  name:'Dodge Clown',  icon:'🤡',col:C.co,cls:DodgeClown, badge:'HOT'},
  {key:'candy',  name:'Candy Flap',   icon:'🍭',col:C.cg,cls:CandyFlap,  badge:null},
  {key:'whack',  name:'Whack-a-Mole', icon:'🦔',col:C.cy,cls:WhackMole,  badge:'30s'},
  {key:'pong',   name:'Pong Solo',    icon:'🏓',col:C.cb,cls:PongSolo,   badge:null},
  {key:'coin',   name:'Coin Rain',    icon:'💰',col:C.cy,cls:CoinRain,   badge:null},
  {key:'memory', name:'Memory Flash', icon:'🃏',col:C.cv,cls:MemoryFlash,badge:null},
  {key:'gravity',name:'Gravity Ball', icon:'⚽',col:C.cg,cls:GravityBall,badge:'TILT'},
  {key:'typing', name:'Typing Rush',  icon:'⌨️', col:C.ct,cls:TypingRush, badge:null},
];

// ═══════════════════════════════════════
//  ENGINE
// ═══════════════════════════════════════
const CA=(()=>{
  const canvas=document.getElementById('g-canvas');
  const ctx=canvas.getContext('2d');
  const fx=new FX(),sk=new Shake();
  let W=800,H=440,game=null,gkey=null,running=false,raf=null,lastT=0;

  // Virtual controls refs
  const vCtrlEl=document.getElementById('vCtrl');
  const dpUp=document.getElementById('dpUp');
  const dpDown=document.getElementById('dpDown');
  const dpLeft=document.getElementById('dpLeft');
  const dpRight=document.getElementById('dpRight');
  const aBtn=document.getElementById('aBtn');

  function resize(){
    if(!document.getElementById('gameWrap').classList.contains('on'))return;
    const hasVCtrl=IS_MOBILE&&vCtrlEl.classList.contains('show');
    const hudH=document.getElementById('g-hud').offsetHeight;
    const ctrlH=document.getElementById('g-ctrl').offsetHeight;
    const vCtrlH=hasVCtrl?vCtrlEl.offsetHeight:0;
    W=window.innerWidth;
    H=window.innerHeight-hudH-ctrlH-vCtrlH;
    canvas.width=W;canvas.height=Math.max(H,200);
    H=canvas.height;
  }

  function setupVCtrl(vCtrlType){
    // Hide all virtual buttons first
    dpUp.style.display='';dpDown.style.display='';dpLeft.style.display='';dpRight.style.display='';
    document.getElementById('dpad').style.visibility='visible';

    if(!IS_MOBILE){vCtrlEl.classList.remove('show');return;}

    if(vCtrlType==='tap'||vCtrlType==='touch'){
      // Only show action button, hide dpad
      document.getElementById('dpad').style.visibility='hidden';
      aBtn.textContent='TAP';
      vCtrlEl.classList.add('show');
    } else if(vCtrlType==='dpad'){
      document.getElementById('dpad').style.visibility='visible';
      aBtn.textContent='ACTION';
      vCtrlEl.classList.add('show');
    } else if(vCtrlType==='dpad-lr'){
      dpUp.style.display='none';dpDown.style.display='none';
      aBtn.style.display='none';
      vCtrlEl.classList.add('show');
      aBtn.style.display='';
    } else if(vCtrlType==='letters'){
      document.getElementById('dpad').style.visibility='hidden';
      aBtn.textContent='NONE'; aBtn.style.display='none';
      vCtrlEl.classList.add('show');
      aBtn.style.display='';
    } else {
      vCtrlEl.classList.remove('show');
    }
  }

  // D-pad touch handling
  function holdBtn(key, keyUp){
    return {
      start(e){e.preventDefault();if(game&&running)game.input?.(key);},
      end(e){e.preventDefault();if(game&&running&&keyUp)game.input?.(keyUp);}
    };
  }
  function btnEvents(el, key, keyUp){
    el.addEventListener('touchstart',e=>{e.preventDefault();el.classList.add('pressed');if(game&&running)game.input?.(key);},{passive:false});
    el.addEventListener('touchend',e=>{e.preventDefault();el.classList.remove('pressed');if(game&&running&&keyUp)game.input?.(keyUp);},{passive:false});
    el.addEventListener('mousedown',e=>{el.classList.add('pressed');if(game&&running)game.input?.(key);});
    el.addEventListener('mouseup',e=>{el.classList.remove('pressed');if(game&&running&&keyUp)game.input?.(keyUp);});
  }
  btnEvents(dpUp,'up','upUp');
  btnEvents(dpDown,'down','downUp');
  btnEvents(dpLeft,'left','leftUp');
  btnEvents(dpRight,'right','rightUp');
  btnEvents(aBtn,'action',null);

  // swipe detection on canvas
  let swipeStart=null;
  canvas.addEventListener('touchstart',e=>{
    e.preventDefault();if(!game||!running)return;
    const r=canvas.getBoundingClientRect(),t=e.touches[0];
    const mx=t.clientX-r.left,my=t.clientY-r.top;
    swipeStart={x:mx,y:my,t:Date.now()};
    game.click?.(mx,my);game.input?.('action');game.mm?.(mx,my);
    // resume audio context
    SFX.play && (()=>{})();
  },{passive:false});
  canvas.addEventListener('touchmove',e=>{
    e.preventDefault();if(!game||!running)return;
    const r=canvas.getBoundingClientRect(),t=e.touches[0];
    const mx=t.clientX-r.left,my=t.clientY-r.top;
    game.mm?.(mx,my);
    // swipe-based movement for snake
    if(swipeStart&&game.input){
      const dx=mx-swipeStart.x,dy=my-swipeStart.y;
      if(Math.abs(dx)>22||Math.abs(dy)>22){
        if(Math.abs(dx)>Math.abs(dy)){dx>0?game.input('right'):game.input('left');}
        else{dy>0?game.input('down'):game.input('up');}
        swipeStart={x:mx,y:my,t:Date.now()};
      }
    }
  },{passive:false});
  canvas.addEventListener('touchend',e=>{e.preventDefault();swipeStart=null;},{passive:false});

  // mouse
  canvas.addEventListener('mousemove',e=>{
    if(!game||!running)return;const r=canvas.getBoundingClientRect();
    const mx=e.clientX-r.left,my=e.clientY-r.top;game.mm?.(mx,my);game.mouseMove?.(mx);
  });
  canvas.addEventListener('click',e=>{
    if(!game||!running)return;const r=canvas.getBoundingClientRect();
    game.click?.(e.clientX-r.left,e.clientY-r.top);game.input?.('action');
  });

  // keyboard
  const keys={};
  document.addEventListener('keydown',e=>{
    if(keys[e.code])return;keys[e.code]=true;
    if(!game||!running){if(e.code==='Escape')return;return;}
    if(e.code==='Escape'){menu();return;}
    if(e.code==='Space'){e.preventDefault();game.input?.('action');}
    if(e.code==='ArrowUp'){e.preventDefault();game.input?.('up');}
    if(e.code==='ArrowLeft'){e.preventDefault();game.input?.('left');}
    if(e.code==='ArrowRight'){e.preventDefault();game.input?.('right');}
    if(e.code==='ArrowDown'){e.preventDefault();game.input?.('down');}
    if(e.code==='KeyA')game.input?.('a');if(e.code==='KeyD')game.input?.('d');
    if(e.code==='KeyW')game.input?.('w');if(e.code==='KeyS')game.input?.('s');
    if(e.key.length===1&&!e.ctrlKey&&!e.metaKey)game.keyPress?.(e.key);
  });
  document.addEventListener('keyup',e=>{
    delete keys[e.code];if(!game||!running)return;
    if(e.code==='ArrowLeft')game.input?.('leftUp');if(e.code==='ArrowRight')game.input?.('rightUp');
    if(e.code==='KeyA')game.input?.('aUp');if(e.code==='KeyD')game.input?.('dUp');
  });
  window.addEventListener('resize',()=>{resize();if(game){game.W=W;game.H=H;}});

  function buildMenu(){
    const grid=document.getElementById('mgrid');grid.innerHTML='';
    for(const d of DEFS){
      const el=document.createElement('div');el.className='m-tile';
      el.innerHTML=`<div class="m-tile-sw" style="background:${d.col}"></div>
        ${d.badge?`<div class="m-tile-badge">${d.badge}</div>`:''}
        <span class="m-tile-icon">${d.icon}</span>
        <span class="m-tile-name">${d.name}</span>
        <span class="m-tile-best">BEST: ${SC.get(d.key)}</span>`;
      el.onclick=()=>{SFX.play('menu');start(d.key);};
      grid.appendChild(el);
    }
    document.getElementById('repItems').innerHTML=DEFS.map(d=>`<div class="m-ri">${d.icon}<b>${SC.get(d.key)}</b></div>`).join('');
    document.getElementById('repTotal').textContent=SC.total();
  }

  function start(key){
    gkey=key;const def=DEFS.find(d=>d.key===key);
    document.getElementById('menuWrap').style.display='none';
    document.getElementById('gameWrap').classList.add('on');
    document.getElementById('death').classList.remove('on');
    document.getElementById('gName').textContent=def.icon+' '+def.name;
    document.getElementById('gBest').textContent=SC.get(key);
    document.getElementById('gScore').textContent='0';
    document.getElementById('ctrlL').textContent=IS_MOBILE?'📱 Touch ready':'⌨️ '+def.cls.prototype.hint;
    setupVCtrl(def.cls.prototype.vCtrl||'none');
    resize();
    game=new def.cls(W,H,fx,sk);
    // iOS gyro permission for gravity ball
    if(key==='gravity'&&game._needsPerm){
      game.requestGyro();
    }
    running=true;
    if(!raf){lastT=performance.now();raf=requestAnimationFrame(loop);}
  }

  function loop(ts){
    const dt=Math.min((ts-lastT)/1000,.05);lastT=ts;
    if(!running||!game){raf=requestAnimationFrame(loop);return;}
    ctx.clearRect(0,0,W,H);ctx.save();sk.tick(dt);sk.apply(ctx);
    game.tick(dt);game.draw(ctx);
    document.getElementById('gScore').textContent=game.score||0;
    fx.tick(dt);fx.draw(ctx);ctx.restore();
    if(!game.alive){running=false;setTimeout(()=>showDeath(game.score),580);}
    raf=requestAnimationFrame(loop);
  }

  function showDeath(sc){
    const isNew=SC.set(gkey,sc);
    document.getElementById('dScore').textContent=sc;
    document.getElementById('dTitle').textContent=isNew?'NEW RECORD! 🏆':'GAME OVER!';
    document.getElementById('dRec').textContent=isNew?'You beat your best!':'Best: '+SC.get(gkey);
    document.getElementById('death').classList.add('on');
    if(isNew)SFX.play('good');
  }

  function menu(){
    running=false;game=null;vCtrlEl.classList.remove('show');
    document.getElementById('gameWrap').classList.remove('on');
    document.getElementById('death').classList.remove('on');
    document.getElementById('menuWrap').style.display='';
    buildMenu();
  }

  function retry(){document.getElementById('death').classList.remove('on');start(gkey);}

  buildMenu();lastT=performance.now();raf=requestAnimationFrame(loop);
  return{start,menu,retry};
})();
</script>
</body>
